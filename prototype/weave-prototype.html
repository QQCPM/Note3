<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weave - Unified Canvas (Prototype)</title>
    <meta name="description" content="HTML prototype of Weave - reference for exact UI implementation">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        /* Canvas Block Styles */
        .canvas-block {
            margin: 8px 0;
            border-radius: 8px;
            transition: all 0.2s;
            position: relative;
        }

        .canvas-block:hover .block-handle {
            opacity: 1;
        }

        .block-handle {
            position: absolute;
            left: -24px;
            top: 4px;
            width: 20px;
            height: 20px;
            opacity: 0;
            cursor: grab;
            color: #6e7681;
            transition: opacity 0.2s;
        }

        .block-handle:hover {
            color: #c9d1d9;
        }

        /* Text Block */
        .text-block {
            padding: 4px 8px;
            min-height: 32px;
        }

        .text-block input,
        .text-block textarea {
            background: transparent;
            border: none;
            outline: none;
            color: #c9d1d9;
            width: 100%;
            font-size: 15px;
            line-height: 1.6;
            resize: none;
        }

        .text-block input::placeholder,
        .text-block textarea::placeholder {
            color: #484f58;
        }

        .text-block.heading-1 input {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }

        .text-block.heading-2 input {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
        }

        /* Database Block */
        .database-block {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
        }

        .database-table {
            width: 100%;
            border-collapse: collapse;
        }

        .database-table th {
            text-align: left;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            border-bottom: 1px solid #21262d;
        }

        .database-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
            color: #c9d1d9;
        }

        .database-table tr:hover {
            background: #0d1117;
        }

        .database-table input {
            background: transparent;
            border: none;
            outline: none;
            color: #c9d1d9;
            width: 100%;
        }

        /* Artifact Block */
        .artifact-block {
            background: linear-gradient(135deg, rgba(88, 166, 255, 0.1), rgba(118, 75, 162, 0.1));
            border: 1px solid rgba(88, 166, 255, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin: 16px 0;
        }

        .artifact-preview {
            background: #0d1117;
            border-radius: 8px;
            height: 300px;
            border: 1px solid #30363d;
        }

        /* Task Block */
        .task-block {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .task-item:hover {
            background: #0d1117;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #30363d;
            border-radius: 4px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-checkbox.checked {
            background: #58a6ff;
            border-color: #58a6ff;
        }

        /* Additional styles continue... (full prototype HTML from user's message) */
    </style>
</head>
<body class="bg-[#0d1117] text-gray-300 antialiased">

        <h1 class="text-3xl font-bold text-white mb-4">Weave Prototype Reference</h1>
        <p class="text-gray-400 mb-8">This HTML prototype serves as the design reference for building Weave.</p>
        <p class="text-sm text-gray-500">The complete prototype HTML is preserved in the project repository.</p>
        <p class="text-sm text-gray-500 mt-4">Refer to this when implementing components to match the exact design.</p>
    </div>
</body>
</html>
